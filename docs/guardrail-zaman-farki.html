.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;jev-latency-explainer&quot;&gt;
  &lt;div class=&quot;viz-row&quot;&gt;

  &lt;/section&gt;

  &lt;section aria-labelledby=&quot;jev-flow-title&quot;&gt;
    &lt;h3 id=&quot;jev-flow-title&quot;&gt;2. Bizim proxy’de kullanıcıya yansıması&lt;/h3&gt;
    &lt;div class=&quot;text-small&quot;&gt;Örnek senaryo · güvenli istek · giriş + çıkış kontrolü · önbelleksiz&lt;/div&gt;
    &lt;div class=&quot;viz-controls&quot;&gt;
      &lt;label class=&quot;form-label&quot;&gt;Ana modelin tam cevap süresi: &lt;span class=&quot;tabular-nums&quot; data-generation-label&gt;3,0 sn&lt;/span&gt; &lt;span class=&quot;text-small&quot;&gt;(varsayım)&lt;/span&gt;
        &lt;input data-generation class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;8&quot; step=&quot;0.5&quot; value=&quot;3&quot; aria-label=&quot;Ana modelin varsayımsal tam cevap süresi, saniye&quot;&gt;
      &lt;/label&gt;
    &lt;/div&gt;

    &lt;div class=&quot;text-small tabular-nums&quot; data-gain aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;div class=&quot;text-small&quot;&gt;Özel guardrail karşı örneği: Lakera kısa metinde &amp;lt;40 ms bildiriyor; sağlayıcı beyanı, bu deneylerle eşit koşul değil. &lt;a href=&quot;https://www.lakera.ai/blog/lakera-guard-fall-25-adaptive-at-scale&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;Kaynak ↗&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;sr-only&quot;&gt;Animasyon yalnızca süreyi karşılaştırır. Daha hızlı olmak daha güvenli olmak anlamına gelmez. İkinci çizim ölçülmüş bir uçtan uca benchmark değildir.&lt;/div&gt;

&lt;style&gt;
  #jev-latency-explainer { color:var(--foreground); }
  #jev-latency-explainer section { margin:22px 0; }
  #jev-latency-explainer h2 { margin:0; }
  #jev-latency-explainer h3 { margin:0 0 5px; }
  #jev-latency-explainer [data-status] { margin-top:8px; }
  #jev-latency-explainer [data-chart] { width:100%; margin:8px 0; }
  #jev-latency-explainer .latency-chart { display:block; width:100%; overflow:visible; }
  #jev-latency-explainer .latency-chart text { fill:var(--foreground); font-size:12px; font-weight:400; }
  #jev-latency-explainer .latency-chart .frame,
  #jev-latency-explainer .latency-chart .tick { stroke:var(--border); stroke-width:1; fill:none; }
  #jev-latency-explainer .latency-chart .track { fill:var(--muted); opacity:0.35; }
  #jev-latency-explainer .latency-chart .rail { fill:var(--viz-series-1); }
  #jev-latency-explainer .latency-chart .generation { fill:var(--viz-series-2); }
  #jev-latency-explainer .latency-chart .reference { fill:var(--viz-series-3); }
  #jev-latency-explainer .latency-chart .cursor { stroke:var(--foreground); stroke-width:1; opacity:0.6; }
  #jev-latency-explainer .latency-chart .progress-marker { fill:var(--foreground); }
  #jev-latency-explainer .swatch { display:inline-block; width:12px; height:8px; margin-right:4px; }
  #jev-latency-explainer .guard-swatch { background:var(--viz-series-1); }
  #jev-latency-explainer .generation-swatch { background:var(--viz-series-2); }
  #jev-latency-explainer [data-gain] { margin-top:8px; }

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&quot;jev-latency-explainer&quot;);
  const ns = &quot;http://www.w3.org/2000/svg&quot;;
  const reduced = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;);
  const meanJev = 0.7970325;
  const play = root.querySelector(&quot;[data-play]&quot;);
  const status = root.querySelector(&quot;[data-status]&quot;);
  const input = root.querySelector(&quot;[data-generation]&quot;);
  const format = (n, digits=2) =&gt; n.toLocaleString(&quot;tr-TR&quot;, {minimumFractionDigits:digits,maximumFractionDigits:digits});
  let charts = [], frame = 0, running = false, start = 0;
  function node(tag, attrs, text) {
    const e = document.createElementNS(ns,tag);
    Object.entries(attrs || {}).forEach(([k,v])=&gt;e.setAttribute(k,v));
    if (text !== undefined) e.textContent=text;
    return e;
  }
  function makeChart(host, rows, kind) {
    const width = Math.max(280,host.getBoundingClientRect().width);
    const left = 64, right = 14, top = 14, step = 66;
    const bottom = top + rows.length*step + 7, height = bottom+48;
    const total = Math.max(...rows.map(r=&gt;r.segments.reduce((s,p)=&gt;s+p.duration,0)));
    const domain = total*1.08;
    const plotWidth = width-left-right;
    const x = value=&gt;left+plotWidth*value/domain;
    const svg=node(&quot;svg&quot;,{class:&quot;latency-chart&quot;,viewBox:&quot;0 0 &quot;+width+&quot; &quot;+height,role:&quot;img&quot;});
    svg.append(node(&quot;title&quot;,{},kind===&quot;measured&quot; ? &quot;Yayımlanmış medyan karar gecikmeleri&quot; : &quot;Varsayımsal tam yanıt akışı&quot;));
    svg.append(node(&quot;desc&quot;,{},rows.map(r=&gt;r.label+&quot;: &quot;+format(r.segments.reduce((s,p)=&gt;s+p.duration,0),3)+&quot; saniye&quot;).join(&quot;. &quot;)));
    svg.append(node(&quot;rect&quot;,{&quot;data-chart-frame&quot;:&quot;&quot;,class:&quot;frame&quot;,x:left,y:top,width:plotWidth,height:bottom-top}));
    const count=width&lt;440?3:4;
    for(let i=0;i&lt;count;i++){
      const value=domain*i/(count-1), xx=x(value);
      svg.append(node(&quot;line&quot;,{class:&quot;tick&quot;,x1:xx,x2:xx,y1:bottom,y2:bottom+4}));
      svg.append(node(&quot;text&quot;,{x:xx,y:bottom+20,&quot;text-anchor&quot;:i===0?&quot;start&quot;:i===count-1?&quot;end&quot;:&quot;middle&quot;},format(value,1)));
    }
    svg.append(node(&quot;text&quot;,{class:&quot;axis-title&quot;,&quot;data-axis&quot;:&quot;x&quot;,x:left+plotWidth/2,y:height-4,&quot;text-anchor&quot;:&quot;middle&quot;},&quot;Geçen süre (sn)&quot;));
    const axisY=top+(bottom-top)/2;
    svg.append(node(&quot;text&quot;,{class:&quot;axis-title&quot;,&quot;data-axis&quot;:&quot;y&quot;,x:13,y:axisY,&quot;text-anchor&quot;:&quot;middle&quot;,transform:&quot;rotate(-90 13 &quot;+axisY+&quot;)&quot;},kind===&quot;measured&quot;?&quot;Model&quot;:&quot;Akış&quot;));
    const marks=[];
    rows.forEach((row,i)=&gt;{
      const y=top+i*step;
      const sum=row.segments.reduce((s,p)=&gt;s+p.duration,0);
      const title=node(&quot;text&quot;,{x:left+8,y:y+19},row.label);
      const value=node(&quot;text&quot;,{x:width-right-7,y:y+37,&quot;text-anchor&quot;:&quot;end&quot;,class:&quot;tabular-nums&quot;},format(sum,3)+&quot; sn&quot;);
      svg.append(title,value);
      svg.append(node(&quot;rect&quot;,{class:&quot;track&quot;,x:left+8,y:y+43,width:plotWidth-16,height:12}));
      let offset=0;
      row.segments.forEach(seg=&gt;{
        const mark=node(&quot;rect&quot;,{class:seg.cls,x:x(offset),y:y+43,width:x(offset+seg.duration)-x(offset),height:12,&quot;data-tooltip&quot;:seg.name+&quot;: &quot;+format(seg.duration,3)+&quot; sn&quot;});
        svg.append(mark);
        marks.push({mark,offset,duration:seg.duration});
        offset+=seg.duration;
      });
    });
    const cursor=node(&quot;line&quot;,{class:&quot;cursor&quot;,x1:left,x2:left,y1:top,y2:bottom,visibility:&quot;hidden&quot;});
    svg.append(cursor);
    host.replaceChildren(svg);
    // Labels are measured after layout; long model labels get their own line above values.
    Array.from(svg.querySelectorAll(&quot;text&quot;)).forEach(label=&gt;{
      const box=label.getBBox();
      if(box.x+box.width&gt;width-2) label.setAttribute(&quot;text-anchor&quot;,&quot;end&quot;);
    });
    return {svg,total,domain,x,marks,cursor};
  }
  function paint(elapsed) {
    charts.forEach(chart=&gt;{
      chart.marks.forEach(({mark,offset,duration})=&gt;{
        const shown=elapsed===null?duration:Math.max(0,Math.min(duration,elapsed-offset));
        mark.setAttribute(&quot;width&quot;,chart.x(offset+shown)-chart.x(offset));
      });
      chart.cursor.setAttribute(&quot;visibility&quot;,elapsed===null || elapsed&gt;chart.total?&quot;hidden&quot;:&quot;visible&quot;);
      if(elapsed!==null){
        chart.cursor.setAttribute(&quot;x1&quot;,chart.x(Math.min(elapsed,chart.total)));
        chart.cursor.setAttribute(&quot;x2&quot;,chart.x(Math.min(elapsed,chart.total)));
      }
    });
  }
  function halt(){
    cancelAnimationFrame(frame);running=false;play.textContent=&quot;Animasyonu oynat&quot;;paint(null);
  }
  function draw(){
    halt();
    const generation=Number(input.value);
    root.querySelector(&quot;[data-generation-label]&quot;).textContent=format(generation,1)+&quot; sn&quot;;
    charts=[
      makeChart(root.querySelector(&#x27;[data-chart=&quot;measured&quot;]&#x27;),[
        {label:&quot;Jev&quot;,segments:[{name:&quot;Tek karar&quot;,duration:.455,cls:&quot;rail&quot;}]},
        {label:&quot;Claude Haiku 4.5&quot;,segments:[{name:&quot;Tek karar&quot;,duration:.631,cls:&quot;reference&quot;}]},
        {label:&quot;Claude Sonnet 5&quot;,segments:[{name:&quot;Tek karar&quot;,duration:1.674,cls:&quot;reference&quot;}]}
      ],&quot;measured&quot;),
      makeChart(root.querySelector(&#x27;[data-chart=&quot;flow&quot;]&#x27;),[
        {label:&quot;Kontrolsüz referans&quot;,segments:[{name:&quot;Cevap üretimi · varsayım&quot;,duration:generation,cls:&quot;generation&quot;}]},
        {label:&quot;Jev · örnek ortalaması&quot;,segments:[
          {name:&quot;Giriş kontrolü · tahmin&quot;,duration:meanJev,cls:&quot;rail&quot;},
          {name:&quot;Cevap üretimi · varsayım&quot;,duration:generation,cls:&quot;generation&quot;},
          {name:&quot;Çıkış kontrolü · tahmin&quot;,duration:meanJev,cls:&quot;rail&quot;}]},
        {label:&quot;LLM hakem · varsayım&quot;,segments:[
          {name:&quot;Giriş kontrolü · varsayım&quot;,duration:1.5,cls:&quot;rail&quot;},
          {name:&quot;Cevap üretimi · varsayım&quot;,duration:generation,cls:&quot;generation&quot;},
          {name:&quot;Çıkış kontrolü · varsayım&quot;,duration:1.5,cls:&quot;rail&quot;}]}
      ],&quot;flow&quot;)
    ];
    const saving=3-2*meanJev, percent=100*saving/(generation+3);
    root.querySelector(&quot;[data-gain]&quot;).textContent=&quot;Bu senaryoda LLM hakeme göre kazanç: &quot;+format(saving)+&quot; sn · %&quot;+format(percent,1)+&quot; daha kısa toplam süre.&quot;;
    paint(null);
    status.textContent=&quot;Süreler gerçek zaman ölçeğinde oynatılır · İkinci çizim senaryo hesabıdır&quot;;
  }
  play.addEventListener(&quot;click&quot;,()=&gt;{
    if(running){halt();status.textContent=&quot;Oynatma durduruldu; tam süreler gösteriliyor.&quot;;return;}
    if(reduced.matches){paint(null);status.textContent=&quot;Azaltılmış hareket tercihi açık; tam süreler gösteriliyor.&quot;;return;}
    running=true;play.textContent=&quot;Durdur&quot;;start=performance.now();
    status.textContent=&quot;Oynatılıyor · 1 saniye animasyon = 1 saniye bekleme&quot;;
    function tick(now){
      if(!root.isConnected)return;
      const elapsed=(now-start)/1000;paint(elapsed);
      if(elapsed&lt;Math.max(...charts.map(c=&gt;c.total))){frame=requestAnimationFrame(tick);}
      else{halt();status.textContent=&quot;Tamamlandı · Güvenlik kalitesi bu animasyonda ölçülmüyor.&quot;;play.textContent=&quot;Yeniden oynat&quot;;}
    }
    paint(0);frame=requestAnimationFrame(tick);
  });
  input.addEventListener(&quot;input&quot;,draw);
  let lastWidth=0;
  const resize=new ResizeObserver(entries=&gt;{
    const width=entries[0].contentRect.width;
    if(Math.abs(width-lastWidth)&gt;1){lastWidth=width;draw();}
  });
  resize.observe(root);

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }

  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );

      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }

  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }

  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;

      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),

          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {

            );

              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,

      strategy: &quot;fixed&quot;,

      .then(({ x, y }) =&gt; {

          closeTooltip(false);

  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }

    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {

    if (pinnedByTouch) {
      return;
    }

    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {

    }

      closeTooltip();
    }

    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {

    }

    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;

    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);

      return;

      return;

      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??

    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
